# Пример сценария настройки pgbouncer.
#
# Значения обезличены. В прежних примерах в репозитории лежали настоящие
# адреса, CI-идентификаторы, имена хостов и стендов внутреннего контура —
# подставляйте свои и не коммитьте их в публичный репозиторий.
service: psqlse_tuningpgbouncer

parameters:
  role: standalone
  version: "6.5.1"
  max_client_conn: 900
  default_pool_size: 750
  max_db_connections: 750
  max_user_connections: 750
  server_reset_query: "DISCARD ALL"
  ssl_mode: prefer
  skip_sm_conflicts: false

targets:
  - svm_ci: CI00000001
  - svm_ci: CI00000002
