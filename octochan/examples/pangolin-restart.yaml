# Пример сценария перезапуска pangolin.
#
# Указывайте либо targets, либо items, но не оба сразу: иначе один и тот же
# сервер получит две команды перезапуска. Сценарий это проверяет.
service: pangolin_restart

parameters:
  restart: instance
  skip_sm_conflicts: false
  # Без confirm: true сценарий не выполнится.
  confirm: true

targets:
  - svm_ci: CI00000001
