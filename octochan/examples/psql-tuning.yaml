# Пример сценария настройки параметров PostgreSQL.
#
# ip_replics сопоставляется с целями по сквозной позиции: первый адрес —
# первому CI, второй — второму и так далее. Если адресов меньше, чем CI,
# сценарий остановится с ошибкой ещё до отправки запросов.
service: psql_tuning_params_se

parameters:
  role: standalone
  port: 5433
  svm_ip: 10.0.0.10
  ip_replics: "10.0.0.10, 10.0.0.11"
  restart: false
  hugepages: false
  skip_sm_conflicts: false

  parameters:
    - name: max_connections
      setting: "800"
    - name: shared_buffers
      setting: "8GB"
    - name: work_mem
      setting: "16MB"

targets:
  - svm_ci: CI00000001
  - svm_ci: CI00000002
